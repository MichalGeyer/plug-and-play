[tool.poetry]
name = "latent-diffusion"
version = "0.0.1"
description = "Latent Diffusion Models"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "ldm"}]

[tool.poetry.dependencies]
python = "^3.8.5"
torch = "*"
torchvision = "*"
numpy = "*"
albumentations = "*"
diffusers = "*"
opencv-python = "*"
pudb = "*"
invisible-watermark = "*"
imageio = "*"
imageio-ffmpeg = "*"
pytorch-lightning = "*"
omegaconf = "*"
test-tube = "*"
streamlit = "*"
einops = "*"
torch-fidelity = "*"
transformers = "*"
torchmetrics = "*"
kornia = "*"
scikit-learn = "*"
tqdm = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.1"

[tool.poetry.scripts]
test = "pytest:main"
tests = "pytest:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=ldm",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
    "--showlocals",
    "--verbose"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests"
]

[tool.coverage.run]
source = ["ldm"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/setup.py",
    "*/run_*.py",
    "*/predict.py"
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "except ImportError:"
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"